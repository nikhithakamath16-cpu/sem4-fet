<!DOCTYPE html>
<html>
<head>

<style>
  h1{
    color:tomato;
  }

body{
  font-family:Arial;
  background:light blue;
}

.container{
  position:relative;
  width:500px;
  height:350px;
  margin:auto;
  margin-top:60px;
}

.box{
  width:180px;
  height:180px;
  border-radius:10px;
  position:absolute;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold;
  color:white;
  transition:0.5s;
}

.red{
  background:crimson;
  left:20px;
  top:20px;
  z-index:1;
}

.blue{
  background:royalblue;
  left:120px;
  top:80px;
  z-index:2;
}

.green{
  background:seagreen;
  left:220px;
  top:140px;
  z-index:3;
}

button{
  margin:10px;
  padding:10px 15px;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

.btn-red{
  background:crimson;
}

.btn-blue{
  background:royalblue;
}

.btn-green{
  background:seagreen;
}

#message{
  text-align:center;
  font-size:24px;
  margin-top:20px;
  font-weight:bold;
  color:#333;
}

</style>

</head>

<body>
  <h1>z-index</h1>

<div class="container">

  <div id="redBox" class="box red">
    RED
  </div>

  <div id="blueBox" class="box blue">
    BLUE
  </div>

  <div id="greenBox" class="box green">
    GREEN
  </div>

</div>

<div style="text-align:center;">

<button class="btn-red" onclick="front('redBox','RED BOX IS FRONT')">
Red Front
</button>

<button class="btn-blue" onclick="front('blueBox','BLUE BOX IS FRONT')">
Blue Front
</button>

<button class="btn-green" onclick="front('greenBox','GREEN BOX IS FRONT')">
Green Front
</button>

</div>

<div id="message">
CLICK A BUTTON
</div>

<script>

let z = 4;

function front(id,text){

  document.getElementById(id).style.zIndex = z;

  z++;

  document.getElementById("message").innerHTML = text;

}
 

</script>
 <a href="https://nikhithakamath16-cpu.github.io/sem4-fet">Go to Home page</a>
</body>
</html>
