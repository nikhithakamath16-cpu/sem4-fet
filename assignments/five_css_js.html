<!DOCTYPE html>
<html>
<head>
<style>
.box{
  width:150px;
  height:150px;
  position:absolute;
}

#red{
  background:red;
  top:50px;
  left:50px;
  z-index:1;
}

#green{
  background:green;
  top:80px;
  left:80px;
  z-index:2;
}

#blue{
  background:blue;
  top:110px;
  left:110px;
  z-index:3;
}
</style>
</head>

<body>

<div id="red" class="box"></div>
<div id="green" class="box"></div>
<div id="blue" class="box"></div>

</body>
</html>
