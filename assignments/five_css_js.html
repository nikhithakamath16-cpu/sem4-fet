<!DOCTYPE html>
<html>
<head>

<style>

.container{
  position:relative;
  width:500px;
  height:350px;
  margin:auto;
  margin-top:60px;
}

/* Common box style */
.box{
  width:180px;
  height:180px;
  border-radius:10px;
  position:absolute;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold;
  color:white;
}

/* Boxes */
.red{
  background:crimson;
  left:20px;
  top:20px;
  z-index:1;
}

.blue{
  background:royalblue;
  left:120px;
  top:80px;
  z-index:2;
}

.green{
  background:seagreen;
  left:220px;
  top:140px;
  z-index:3;
}

/* Buttons */
button{
  margin:10px;
  padding:10px 15px;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

.btn-red{
  background:crimson;
}

.btn-blue{
  background:royalblue;
}

.btn-green{
  background:seagreen;
}

</style>

</head>

<body>

<div class="container">

  <div id="redBox" class="box red">
    RED
  </div>

  <div id="blueBox" class="box blue">
    BLUE
  </div>

  <div id="greenBox" class="box green">
    GREEN
  </div>

</div>

<div style="text-align:center;">

<button class="btn-red" onclick="front('redBox')">
Red Front
</button>

<button class="btn-blue" onclick="front('blueBox')">
Blue Front
</button>

<button class="btn-green" onclick="front('greenBox')">
Green Front
</button>

</div>

<script>

let z = 4;

function front(id){

  document.getElementById(id).style.zIndex = z;

  z++;

}
  
  <a href="https://nikhithakamath16-cpu.github.io/sem4-fet"> Go to Home page</a>
   

</script>

</body>
</html>
