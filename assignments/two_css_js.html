<!DOCTYPE html>
<html>
<head>
    <title>My Skills Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>My Skills Matrix</h2>

<ol>
    <li>Programming Languages
        <ul id="prog">
            <li>Java</li>
            <li>C</li>
            <li>Python</li>
        </ul>
    </li>

    <li>Web Development
        <ul id="web">
            <li>HTML</li>
        </ul>
    </li>

    <li>Database
        <ul id="db">
            <li>MySQL (Basic)</li>
        </ul>
    </li>
</ol>

<button onclick="addSkill()">Add Skill</button>

<script>
function addSkill() {
    var skill = prompt("Enter new skill:");

    if (skill != null) {

        var pattern = /^[A-Za-z ]+$/;

        if (skill.trim() === "") {
            alert("Skill cannot be empty");
        } 
        else if (!pattern.test(skill)) {
            alert("Invalid input! Only alphabets are allowed.");
        } 
        else {
            // Adding to Programming Languages by default
            var ul = document.getElementById("prog");
            var li = document.createElement("li");
            li.textContent = skill;
            ul.appendChild(li);

            alert("Skill added successfully");
        }
    }
}
</script>

<a href="https://nikhithakamath16-cpu.github.io/sem4-fet">Go to Home page</a>

</body>
</html>
