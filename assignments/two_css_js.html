<!DOCTYPE html>
<html>
<head>
    <title>My Skills Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>My Skills Matrix</h2>

<ol>
    <li>Programming Languages
        <ul id="prog">
            <li>Java</li>
            <li>C</li>
            <li>Python</li>
        </ul>
    </li>

    <li>Web Development
        <ul id="web">
            <li>HTML</li>
        </ul>
    </li>

    <li>Database
        <ul id="db">
            <li>MySQL (Basic)</li>
        </ul>
    </li>
</ol>

<button onclick="removeSkill()">Remove Skill</button>

<script>
function removeSkill() {
    var skill = prompt("Enter skill to remove:");

    if (skill != null) {

        var pattern = /^[A-Za-z ]+$/;

        if (skill.trim() === "") {
            alert("Skill cannot be empty");
            return;
        }

        if (!pattern.test(skill)) {
            alert("Invalid input! Only alphabets are allowed.");
            return;
        }

        var found = false;

        var lists = ["prog", "web", "db"];

        for (var i = 0; i < lists.length; i++) {
            var ul = document.getElementById(lists[i]);
            var items = ul.getElementsByTagName("li");

            for (var j = 0; j < items.length; j++) {
                if (items[j].textContent.toLowerCase() === skill.toLowerCase()) {
                    ul.removeChild(items[j]);
                    alert("Skill removed successfully");
                    return;
                }
            }
        }

        alert("Skill not found");
    }
}
</script>

</body>
</html>
