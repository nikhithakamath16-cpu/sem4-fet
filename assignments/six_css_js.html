<!DOCTYPE html>
<html>
<head>
    <title>Student Course Portal</title>
    <script src="script.js"></script>

    <style>
        body{
            font-family:Arial;
            background:lightblue;
            text-align:center;
        }

        .box{
            width:450px;
            margin:auto;
            margin-top:50px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            background:royalblue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        #output{
            margin-top:20px;
            color:darkgreen;
            font-size:18px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Student Course Registration</h2>

    <button onclick="registerCourse()">
        Register Course
    </button>

    <div id="output"></div>

</div>

</body>
</html>
