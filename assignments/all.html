<html>
<title>
  Rectangle area and circumference calculator
</title>
  <style>
    body
    {
      background-color:lightblue;
      text-align:center;
      font-family:Times new Roman;
    }
    h1
    {
      color:tomato;
      text-align:center;
      text-size:20px;
    }
    button
 {
    color:purple;
    margin:auto;
   display:block;
 }
 .container{
    width:420px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 4px 12px gray;
}
    
  </style>
  <body>
    <div class="container">
    <h1>Rectangle Calculator</h1>
      <input type="number" id="length" placeholder="Enter length">
      <input type="number" id="breadth" placeholder="Enter breadth">
      <button onclick="findArea()">Calculate area</button>
      <button onclick="findcircumference()">Calculate circumference</button>
      <h3 id="result"></h3>
    </div>
    <script>
      function findArea()
      {
        let length=document.getElementById("length").value;
        let breadth=document.getElementById("breadth").value;
        let area=length*breadth;
        document.getElementById("result").innerHTML="Area:"+area;
      }
      function findcircumference()
      {
        let length=document.getElementById("length").value;
        let breadth=document.getElementById("breadth").value;
        let cir=2*(length+breadth);
        document.getElementById("result").innerHTML="Circumference:"+cir;
      }
    </script>
    
  </body>
</html>
