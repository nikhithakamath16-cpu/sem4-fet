<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
    <style>
        .error { color: red; }
        .output { color: blue; margin-top: 15px; }
    </style>

    <script>
        function validateForm(event) {
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let usn = document.getElementById("usn").value.trim();
            let email = document.getElementById("email").value.trim();

            let error = "";

            if (name === "" || !/^[A-Za-z ]{3,}$/.test(name)) {
                error += "Enter a valid name<br>";
            }

            if (usn === "" || !/^[A-Za-z0-9]{10}$/.test(usn)) {
                error += "Enter valid USN (10 alphanumeric characters)<br>";
            }

            if (email === "" || !/^[^ ]+@[^ ]+\.[a-z]{2,3}$/.test(email)) {
                error += "Enter valid email<br>";
            }

            document.getElementById("error").innerHTML = error;

            if (error === "") {
                document.getElementById("output").innerHTML =
                    "Name: " + name + "<br>USN: " + usn + "<br>Email: " + email;
            } else {
                document.getElementById("output").innerHTML = "";
            }
        }
    </script>
</head>

<body>

<h2>Student Form</h2>

<form onsubmit="validateForm(event)">
    Name:
    <input type="text" id="name"><br><br>

    USN:
    <input type="text" id="usn"><br><br>

    Email:
    <input type="text" id="email"><br><br>

    <input type="submit" value="Submit">
</form>

<div id="error" class="error"></div>
<div id="output" class="output"></div>

</body>
</html>
