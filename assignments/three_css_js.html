
<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
    <style>
        body {
            font-family: Arial;
            background-color:lightblue;
        }

        .container{
            width: 370px;
            margin: 80px auto;
            padding: 20px;
            background: lightyellow;
            border: 2px solid black;
            border-radius: 10px;
            

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: blue;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }

        #error {
            color: red;
            margin-top: 10px;
        }

        #output {
            color: tomato;
            margin-top: 10px;
        }
    </style>

    <script>
        function validateForm(event) {
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let usn = document.getElementById("usn").value.trim();
            let email = document.getElementById("email").value.trim();

            let errorMsg = "";

            if (!/^[A-Za-z ]{3,}$/.test(name)) {
                errorMsg += "Invalid Name<br>";
            }

            if (!/^[A-Za-z0-9]{10}$/.test(usn)) {
                errorMsg += "Invalid USN<br>";
            }

            if (!/^[^ ]+@[^ ]+\.[a-z]{2,3}$/.test(email)) {
                errorMsg += "Invalid Email<br>";
            }

            document.getElementById("error").innerHTML = errorMsg;

            if (errorMsg === "") {
                document.getElementById("output").innerHTML =
                    "Name: " + name + "<br>USN: " + usn + "<br>Email: " + email;
            } else {
                document.getElementById("output").innerHTML = "";
            }
        }
    </script>
</head>

<body>

<div class="container">
    <h2>Student Form</h2>

    <form onsubmit="validateForm(event)">
        Name:
        <input type="text" id="name"><br><br>

        USN:
        <input type="text" id="usn"><br><br>

        Email:
        <input type="text" id="email"><br><br>

        <input type="submit" value="Submit">
    </form>

    <div id="error"></div>
    <div id="output"></div>
</div>

</body>
</html>
